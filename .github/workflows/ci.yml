name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q lille_model.py cli.py agents tests test_lille_model.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify browser calculator JavaScript parses
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("web/index.html").read_text(encoding="utf8")
          js = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/lille-calculator.js").write_text(js, encoding="utf8")
          PY
          node --check /tmp/lille-calculator.js
      - name: Browser calculation smoke test
        run: node tests/browser_smoke.cjs
      - name: Validate linked audit signature
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          audit = AuditTrail(secret_key="unit-test-key")
          audit.log("tester", "qa", "test", {"ok": True})
          assert audit.verify_integrity()
          audit.logs[0]["event_type"] = "tampered"
          assert not audit.verify_integrity()
          PY
