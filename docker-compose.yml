version: '3.8'

services:
  lille-model-alcoholic-hepatitis:
    build: .
    container_name: lille-model-alcoholic-hepatitis
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=lille-model-alcoholic-hepatitis-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
